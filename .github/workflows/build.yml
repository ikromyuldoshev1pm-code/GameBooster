name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add images and name
        run: |
          R=app/src/main/res
          mkdir -p $R/drawable-nodpi $R/mipmap-anydpi-v26
          pip install --quiet pillow
          python3 - <<'PY'
          import glob, shutil, subprocess, os
          from PIL import Image
          R = "app/src/main/res/drawable-nodpi/"
          def stamp(f):
              out = subprocess.run(["git", "log", "-1", "--format=%ct", "--", f], capture_output=True, text=True).stdout.strip()
              return int(out or 0)
          def newest(lst):
              lst.sort()
              if lst:
                  return lst[-1][1]
              return None
          def put(src, name):
              if src is None:
                  return
              ext = os.path.splitext(src)[1].lower()
              if ext in (".jpg", ".jpeg"):
                  shutil.copy(src, R + name + ".jpg")
              else:
                  shutil.copy(src, R + name + ".png")
          squares = []
          homes = []
          bgs = []
          files = glob.glob("*.png") + glob.glob("*.jpg") + glob.glob("*.jpeg")
          for f in files:
              im = Image.open(f).convert("RGB")
              w, h = im.size
              ts = stamp(f)
              if w == h:
                  squares.append((ts, f))
              elif w / h < 0.75:
                  if im.getextrema()[0][1] > 80:
                      homes.append((ts, f))
                  else:
                      bgs.append((ts, f))
              else:
                  bgs.append((ts, f))
          put(newest(squares), "game_logo")
          put(newest(homes), "game_home")
          put(newest(bgs), "game_bg")
          PY
          cat > $R/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@android:color/black"/>
              <foreground>
                  <inset android:drawable="@drawable/game_logo" android:inset="20%"/>
              </foreground>
          </adaptive-icon>
          EOF
          sed -i 's/GameBooster/CLENOX/g' app/src/main/AndroidManifest.xml app/src/main/java/com/example/gamebooster/MonitorService.kt app/src/main/java/com/example/gamebooster/MainActivity.kt
          sed -i 's|<application|<application android:icon="@mipmap/ic_launcher"|' app/src/main/AndroidManifest.xml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CLENOX-apk
          path: app/build/outputs/apk/debug/app-debug.apk
